name: stand-secure-ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs: 
  ci:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
    steps: 
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  